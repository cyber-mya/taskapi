name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest test_app.py -v

      - name: Build Docker image
        run: |
          docker build -t taskapi:ci .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name taskapi-ci taskapi:ci
          sleep 3
          curl -f http://localhost:8000/health
          docker stop taskapi-ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker tag taskapi:ci ${{ secrets.DOCKERHUB_USERNAME }}/taskapi:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskapi:latest
